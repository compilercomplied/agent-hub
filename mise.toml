[tools]
python = "latest"
uv = "latest"
ruff = "latest"
pulumi = "latest"
node = "latest"

[tasks."test:e2e-docker"]
description = "Run end-to-end tests using Docker Compose"
run = "scripts/run-e2e-in-docker.sh"

[tasks."test:e2e"]
description = "Run end-to-end tests locally"
run = "scripts/run-e2e.sh"

[tasks.static-analysis]
description = "Run static analysis using shared script"
run = "scripts/static-analysis.sh"

[tasks.run]
description = "Run the application with type checking"
depends = ["check:types"]
run = "uv run uvicorn src.main:app --reload"

[tasks.setup-project]
description = "Setup the project from scratch"
run = """
uv sync --all-extras --dev
cd iac
npm install
pulumi stack select local
"""
