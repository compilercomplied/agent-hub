[tools]
python = "latest"
uv = "latest"
ruff = "latest"
pulumi = "latest"
node = "latest"

[tasks."e2e:docker"]
description = "Run end-to-end tests using Docker Compose"
run = "scripts/run-e2e.sh"

[tasks."check:types"]
description = "Run strict type checking"
run = "uv run basedpyright"

[tasks.start]
description = "Run the application with type checking"
depends = ["check:types"]
run = "uv run uvicorn src.main:app --reload"

[tasks.install-packages]
description = "Install all dependencies using uv"
run = "uv sync --all-extras --dev"

[tasks.setup-pulumi]
description = "Setup Pulumi stacks and dependencies"
run = """
cd iac
npm install
pulumi stack init local || true
pulumi stack init prod || true
"""

[tasks.setup-project]
description = "Setup the project from scratch"
depends = ["install-packages", "setup-pulumi"]
